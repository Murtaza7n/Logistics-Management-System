<svg width="200" height="60" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B365D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a4a6f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A7A9AC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1d3d6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="whiteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5E7EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Globe/Sphere with bands -->
  <g transform="translate(30, 15)">
    <!-- White/Light bands for dark background -->
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="url(#whiteGradient)" opacity="0.9" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="url(#silverGradient)" opacity="0.8" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="url(#whiteGradient)" opacity="0.7" transform="rotate(90)"/>
    
    <!-- Silver bands -->
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="url(#silverGradient)" opacity="0.7" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="url(#whiteGradient)" opacity="0.6" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="url(#silverGradient)" opacity="0.5" transform="rotate(120)"/>
    
    <!-- Arrow emerging from globe (white for visibility) -->
    <path d="M -8 8 L 15 25 L 12 22 L 18 22 L 18 28 L 12 28 L 15 25 Z" fill="url(#whiteGradient)"/>
  </g>
  
  <!-- Company Name: S2E (White for dark navbar) -->
  <text x="60" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">S2E</text>
  
  <!-- Company Name: LOGISTICS (Silver for dark navbar) -->
  <text x="105" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#A7A9AC">LOGISTICS</text>
  
  <!-- Arrow line after LOGISTICS -->
  <line x1="185" y1="25" x2="195" y2="25" stroke="#A7A9AC" stroke-width="1.5"/>
  <path d="M 193 22 L 195 25 L 193 28 Z" fill="#A7A9AC"/>
  
  <!-- Tagline (Lighter for visibility) -->
  <text x="100" y="42" font-family="Arial, sans-serif" font-size="9" fill="#A7A9AC" text-anchor="middle">Delivering Trust, Start to End</text>
</svg>
